<title>Daily Fruit</title>
<script>
  // GitHub Pages serves this file for any address that doesn't exist. A WhatsApp payslip link written as
  // https://master.dailyfruit.co.za/payslip/<token> lands here, so hand it over to the app, which shows the payslip.
  (function () {
    var m = location.pathname.match(/\/payslips?\/([A-Za-z0-9_-]{16,128})/i);
    if (m) location.replace('/?payslip=' + m[1]);
  })();
</script>
